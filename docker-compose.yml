services:
  redis_db:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      - redis

  worker:
    build: .
    command: taskiq worker src.broker:broker
    depends_on:
      - redis
volumes:
  redis_data: