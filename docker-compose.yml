services:
  redis_db:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis_db:6379/0
      CODEX_AUTH_PATH: /run/codex-auth/auth.json
    volumes:
      - ${HOME}/.codex/auth.json:/run/codex-auth/auth.json:ro
    ports:
      - "8000:8000"
    depends_on:
      redis_db:
        condition: service_healthy

volumes:
  redis_data:
